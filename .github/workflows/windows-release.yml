name: Windows Release
permissions:
  contents: write

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Build reason'
        required: false
        default: 'manual release build'

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Build Frontend
        env:
          CI: ""
        run: |
          cd web/default
          npm install
          # DISABLE_ESLINT_PLUGIN 必须带着：CRA 的 eslint 插件在当前依赖组合下
          # 会报 "Environment key jest/globals is unknown"，Linux/macOS 的
          # build.sh 里就是靠它绕开的，Windows 这条路径绕开不了。
          DISABLE_ESLINT_PLUGIN=true \
            REACT_APP_VERSION="$(git describe --tags 2>/dev/null || cat ../../VERSION)" \
            npm run build
          cd ../..

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true

      - name: Build Backend
        run: |
          go mod download
          VERSION_TAG=$(git describe --tags 2>/dev/null || cat VERSION)
          go build -ldflags "-s -w -X 'github.com/Elysia-SHY/one-api-plus/common.Version=${VERSION_TAG}'" -o one-api.exe

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: one-api-windows
          path: one-api.exe

      - name: Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: one-api.exe
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
