name: macOS Release
permissions:
  contents: write

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Build reason'
        required: false
        default: 'manual release build'

jobs:
  release:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Build Frontend
        env:
          CI: ""
        run: |
          cd web
          VERSION_TAG=$(git describe --tags 2>/dev/null || cat ../VERSION)
          echo "$VERSION_TAG" > VERSION
          chmod u+x ./build.sh
          REACT_APP_VERSION="$VERSION_TAG" ./build.sh
          cd ..

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true

      - name: Build Backend
        run: |
          go mod download
          VERSION_TAG=$(cat VERSION 2>/dev/null || echo "0.1.0")
          go build -ldflags "-s -w -X 'github.com/Elysia-SHY/one-api-plus/common.Version=${VERSION_TAG}'" -o one-api-macos

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: one-api-macos
          path: one-api-macos

      - name: Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: one-api-macos
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
